# NeuraCam - Default Configuration (FaceCNN V0)
# Architecture: v4 (anchor-based), v5 (anchor-free FPN), v71 (stride-4), v0 (FaceCNN V0 186K)

camera:
  source: 2
  width: 1280
  height: 720
  fps: 30
  processing_width: 320
  processing_height: 240
  use_capture_thread: true

serial:
  port: auto
  baud: 115200
  timeout: 0.1
  batch_commands: true
  control_rate_hz: 100

models:
  face_cnn: models/face_cnn.pth                        # v4.0: 62K anchor-based (legacy)
  face_cnn_v5: models/face_cnn_v5_best.pth             # v5.0: 422K anchor-free FPN
  face_cnn_v71: models/face_cnn_v71_best.pth           # v7.1: 504K stride-4
  face_cnn_v0: models/face_cnn_v0/face_cnn_v0.pth      # V0: 186K FaceCNN V0
  gesture_detector: models/gesture_detector_rf.pkl
  gesture_svm: models/gesture_svm.pkl
  gesture_scaler: models/gesture_scaler.pkl
  gesture_pca: models/gesture_pca.pkl

face_detection:
  architecture: v0                                 # v4, v5, v71, or v0 (recommended)
  confidence_threshold: 0.3
  nms_iou_threshold: 0.25
  input_size: 128
  skip_scale_threshold: 0.9
  num_anchors: 3
  use_depthwise: true
  use_se: true

face_detection_v5:
  confidence_threshold: 0.3
  nms_iou_threshold: 0.3

face_detection_v71:
  confidence_threshold: 0.25
  nms_iou_threshold: 0.3
  resolution_adaptive: true
  use_track_consistency_filter: true

face_detection_v0:
  confidence_threshold: 0.3
  nms_iou_threshold: 0.45
  input_size: 640
  backend: pytorch                                 # pytorch or onnx

kalman:
  process_noise: 0.01
  measurement_noise: 0.1
  max_lost_frames: 5
  iou_threshold: 0.3

pid:
  pan:
    Kp: 2.0
    Ki: 0.05
    Kd: 0.5
    output_limits: [-30, 30]
    integral_limit: 10.0
  tilt:
    Kp: 2.0
    Ki: 0.05
    Kd: 0.5
    output_limits: [-30, 30]
    integral_limit: 10.0
  dead_zone_base: 0.05
  dead_zone_adaptive: true
  max_angle_delta: 5.0

gesture:
  min_confidence: 0.6
  pca_components: 200

hand_detection:
  ycrcb_lower: [0, 133, 77]
  ycrcb_upper: [255, 173, 127]
  hsv_lower: [0, 30, 60]
  hsv_upper: [20, 150, 255]
  use_motion: true
  min_area: 1000

state_machine:
  idle_timeout_frames: 150
  gesture_hold_frames: 5
  search_duration: 90

calibration:
  checkerboard_cols: 9
  checkerboard_rows: 6
  square_size_mm: 25.0

gimbal:
  pan_min: 0
  pan_max: 180
  tilt_min: 45
  tilt_max: 135
  pan_center: 90
  tilt_center: 90
